version: '3.8'

services:
  db-postgres:
    image: postgres:15-alpine
    container_name: inventario-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend-inventario:
    build:
      context: ./backend
    container_name: inventario-backend
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - db-postgres

  frontend-inventario:
    build:
      context: ./frontend
    container_name: inventario-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-inventario

volumes:
  pgdata:
